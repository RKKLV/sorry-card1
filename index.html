<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إلى جودي ♥️</title>
  <!-- Start the Handjet request early; the font includes Arabic glyphs. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Handjet:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- القلوب المتساقطة في الخلفية -->
  <div class="hearts-container" id="heartsContainer"></div> 

  <!-- الشاشة الأولى: الغلاف -->
  <div class="stage-one" id="stageOne">
    <div class="envelope-wrapper">
      <div class="envelope">
        <div class="heart-seal">♥️</div>
      </div>
      <h2>بتمر ثلاث شهور وأنا للحين كل ما جيت أحبّك لقيتني متأخر عليك ♥️</h2>
      <button id="startStoryBtn" class="btn start-btn">تعالي أبي أقول لك شي ما ينقال بسرعه</button>
    </div>
  </div>

  <!-- الشاشة الثانية: النافذة الرئيسية -->
  <div class="window hidden" id="loveWindow">
    <div class="window-header">
      <span class="window-title">♥ Judy.exe</span>
      <div class="window-controls">
        <button class="win-btn">-</button>
        <button class="win-btn">□</button>
        <button class="win-btn close">×</button>
      </div>
    </div>

    <div class="window-body" id="windowBody">
      <!-- القطة التفاعلية -->
      <div class="pixel-cat" id="pixelCat">
        <svg width="80" height="80" viewBox="0 0 100 100">
          <polygon points="20,40 10,15 35,25" fill="#1e1e24"/>
          <polygon points="80,40 90,15 65,25" fill="#1e1e24"/>
          <polygon points="22,37 15,20 32,27" fill="#ff758f"/>
          <polygon points="78,37 85,20 68,27" fill="#ff758f"/>
          <rect x="20" y="30" width="60" height="55" rx="12" fill="#1e1e24"/>
          <ellipse cx="30" cy="62" rx="5" ry="3" fill="#ff758f"/>
          <ellipse cx="70" cy="62" rx="5" ry="3" fill="#ff758f"/>
          <g id="catEyes">
            <circle cx="38" cy="52" r="5" fill="#ffffff"/>
            <circle cx="62" cy="52" r="5" fill="#ffffff"/>
            <circle cx="39" cy="53" r="2.5" fill="#000000"/>
            <circle cx="63" cy="53" r="2.5" fill="#000000"/>
          </g>
          <polygon points="47,58 53,58 50,61" fill="#ff758f"/>
          <path d="M 43 68 C 43 63, 50 63, 50 68 C 50 63, 57 63, 57 68 C 57 73, 50 78, 50 78 C 50 78, 43 73, 43 68 Z" fill="#ff2a5f"/>
        </svg>
      </div>

      <!-- الإطار النصي لتشغيل القصة -->
      <div class="text-container" id="textContainer">
        <div class="typewriter-text" id="storyText"></div>
      </div>

      <!-- منطقة الأزرار المترددة والتفاعلية -->
      <div class="buttons-area hidden" id="buttonsArea">
        <button id="yesBtn" class="btn yes-btn">إي ♥️</button>
        <button id="noBtn" class="btn no-btn">لا</button>
      </div>

      <!-- زر المرحلة الثانية -->
      <button id="nextPhaseBtn" class="btn action-btn hidden">طيب… تعالي الحين 🫴🏻</button>
    </div>
  </div>

  <!-- الشاشة الأخيرة: النهاية والاحتفال -->
  <div class="final-screen hidden" id="finalScreen">
    <div class="final-card">
      <div class="big-heart">انتهى الكرت بس انا ما انتهيت منك ياروحي</div>
      <h1>احبك يا جودي♥️</h1>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
