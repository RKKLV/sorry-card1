<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matcha & Strawberry Letter 🍵🍓</title>

  <!-- خطوط البكسل والخط العربي المعتمد -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&family=Handjet:wght@800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- القلوب والفراولة والماتشا المتساقطة -->
  <div class="particles-container" id="particlesContainer"></div>

  <!-- الشاشة الأولى: الظرف الافتتاحي -->
  <div class="stage-one" id="stageOne">
    <div class="envelope-wrapper">
      <div class="envelope">
        <span class="seal-icon">🍵🍓</span>
      </div>
      <h2>رسالة خاصة بحجم حبك للماتشا 🍓✨</h2>
      <p class="sub-text">اضغط للفتح</p>
      <button class="btn start-btn" id="startBtn">افتح الرسالة 🫴🏻</button>
    </div>
  </div>

  <!-- النافذة الرئيسية (Matcha & Strawberry Retro OS) -->
  <div class="window hidden" id="mainWindow">
    <div class="window-header">
      <span class="window-title">Matcha_Latte.exe 🍓</span>
      <div class="window-controls">
        <button class="win-btn">-</button>
        <button class="win-btn">+</button>
        <button class="win-btn close">×</button>
      </div>
    </div>

    <div class="window-body" id="windowBody">
      <!-- رسمة كوب ماتشا بالفراولة كلاسيكي (Pixel Art SVG) -->
      <div class="pixel-drink">
        <svg width="80" height="90" viewBox="0 0 100 110">
          <!-- الشفاطة -->
          <rect x="52" y="5" width="8" height="30" rx="3" fill="#ff758f" transform="rotate(12 52 5)"/>
          <!-- الكوب الزجاجي -->
          <path d="M 25 30 L 30 95 C 30 100, 70 100, 70 95 L 75 30 Z" fill="rgba(255,255,255,0.7)" stroke="#283618" stroke-width="4"/>
          <!-- طبقة الفراولة (الأسفل) -->
          <path d="M 30 75 L 30 93 C 30 98, 70 98, 70 93 L 70 75 Z" fill="#ff4d6d"/>
          <!-- قطع الفراولة الصغيرة -->
          <circle cx="40" cy="85" r="2" fill="#fff"/>
          <circle cx="55" cy="88" r="2" fill="#fff"/>
          <circle cx="60" cy="80" r="2" fill="#fff"/>
          <!-- طبقة حليب الفراولة (الوسط) -->
          <path d="M 28 55 L 30 75 L 70 75 L 72 55 Z" fill="#ffb3c1"/>
          <!-- طبقة الماتشا (الأعلى) -->
          <path d="M 26 33 L 28 55 L 72 55 L 74 33 Z" fill="#a3b18a"/>
          <!-- الكريمة أو المكعبات -->
          <rect x="35" y="35" width="10" height="10" fill="#e9edc9" rx="2"/>
          <rect x="52" y="38" width="12" height="10" fill="#e9edc9" rx="2"/>
          <!-- عيون لطيفة على الكوب -->
          <circle cx="43" cy="65" r="3" fill="#283618"/>
          <circle cx="57" cy="65" r="3" fill="#283618"/>
          <path d="M 47 70 Q 50 73 53 70" stroke="#283618" stroke-width="2" fill="none"/>
        </svg>
      </div>

      <!-- إطار النص المنقط -->
      <div class="text-container" id="textContainer">
        <div class="typewriter-text" id="typewriterText"></div>
      </div>

      <!-- منطقة الأزرار -->
      <div class="buttons-area hidden" id="buttonsArea">
        <button id="yesBtn" class="btn yes-btn">إي 🍵</button>
        <button id="noBtn" class="btn no-btn">لا 🍓</button>
      </div>

      <!-- زر الانتقال بين المراحل -->
      <button id="nextPhaseBtn" class="btn action-btn hidden">استمرار 🫴🏻</button>
    </div>
  </div>

  <!-- الشاشة النهائية -->
  <div class="final-screen hidden" id="finalScreen">
    <div class="final-card">
      <div class="big-icon">🍵🍓♥️</div>
      <h1>أحبك كثر ما تحبين الماتشا بالفراولة!</h1>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
